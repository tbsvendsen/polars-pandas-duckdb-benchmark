<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #666; }
    .mod { rx: 6; ry: 6; stroke-width: 1.5; }
    .mod-label { font-size: 13px; font-weight: 600; fill: #fff; }
    .mod-file { font-size: 10px; fill: #fff; opacity: 0.85; font-family: 'SF Mono', 'Menlo', monospace; }
    .mod-desc { font-size: 10px; fill: #fff; opacity: 0.9; }
    .flow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .data-label { font-size: 9px; fill: #888; font-style: italic; }
    .output { rx: 4; ry: 4; stroke-width: 1; }
  </style>

  <text x="400" y="28" text-anchor="middle" class="title">Module Architecture</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">Pipeline from data generation through visualization</text>

  <!-- datasets.py -->
  <rect x="30" y="75" width="160" height="100" class="mod" fill="#4C78A8" stroke="#3b6190"/>
  <text x="110" y="100" text-anchor="middle" class="mod-label">datasets</text>
  <text x="110" y="117" text-anchor="middle" class="mod-file">datasets.py</text>
  <text x="110" y="136" text-anchor="middle" class="mod-desc">DatasetSpec config</text>
  <text x="110" y="150" text-anchor="middle" class="mod-desc">generate_dataset()</text>
  <text x="110" y="164" text-anchor="middle" class="mod-desc">save/load parquet</text>

  <!-- operations.py -->
  <rect x="230" y="75" width="160" height="100" class="mod" fill="#F58518" stroke="#d9700f"/>
  <text x="310" y="100" text-anchor="middle" class="mod-label">operations</text>
  <text x="310" y="117" text-anchor="middle" class="mod-file">operations.py</text>
  <text x="310" y="136" text-anchor="middle" class="mod-desc">27 functions</text>
  <text x="310" y="150" text-anchor="middle" class="mod-desc">9 ops × 3 engines</text>
  <text x="310" y="164" text-anchor="middle" class="mod-desc">OP_REGISTRY</text>

  <!-- runner.py -->
  <rect x="430" y="75" width="160" height="100" class="mod" fill="#54A24B" stroke="#438a3c"/>
  <text x="510" y="100" text-anchor="middle" class="mod-label">runner</text>
  <text x="510" y="117" text-anchor="middle" class="mod-file">runner.py</text>
  <text x="510" y="136" text-anchor="middle" class="mod-desc">run_benchmark()</text>
  <text x="510" y="150" text-anchor="middle" class="mod-desc">TimingResult</text>
  <text x="510" y="164" text-anchor="middle" class="mod-desc">MachineInfo</text>

  <!-- run.py (CLI) -->
  <rect x="330" y="215" width="160" height="85" class="mod" fill="#7B4F8A" stroke="#65407a"/>
  <text x="410" y="240" text-anchor="middle" class="mod-label">CLI</text>
  <text x="410" y="257" text-anchor="middle" class="mod-file">run.py</text>
  <text x="410" y="276" text-anchor="middle" class="mod-desc">_dispatch()</text>
  <text x="410" y="290" text-anchor="middle" class="mod-desc">run_all()</text>

  <!-- visualize.py -->
  <rect x="530" y="215" width="160" height="85" class="mod" fill="#B07AA1" stroke="#9a6a8e"/>
  <text x="610" y="240" text-anchor="middle" class="mod-label">visualize</text>
  <text x="610" y="257" text-anchor="middle" class="mod-file">visualize.py</text>
  <text x="610" y="276" text-anchor="middle" class="mod-desc">Plotly HTML reports</text>
  <text x="610" y="290" text-anchor="middle" class="mod-desc">Grouped bar + heatmap</text>

  <!-- figures.py -->
  <rect x="530" y="315" width="160" height="70" class="mod" fill="#E15759" stroke="#c94547"/>
  <text x="610" y="340" text-anchor="middle" class="mod-label">figures</text>
  <text x="610" y="357" text-anchor="middle" class="mod-file">figures.py</text>
  <text x="610" y="374" text-anchor="middle" class="mod-desc">Matplotlib static PNG</text>

  <!-- Outputs -->
  <rect x="30" y="230" width="130" height="30" class="output" fill="#f0f0f0" stroke="#ccc"/>
  <text x="95" y="250" text-anchor="middle" font-size="10" fill="#555">data/*.parquet</text>

  <rect x="30" y="280" width="130" height="30" class="output" fill="#f0f0f0" stroke="#ccc"/>
  <text x="95" y="300" text-anchor="middle" font-size="10" fill="#555">results/results.json</text>

  <rect x="30" y="330" width="130" height="30" class="output" fill="#f0f0f0" stroke="#ccc"/>
  <text x="95" y="350" text-anchor="middle" font-size="10" fill="#555">results/figures/*.png</text>

  <!-- Flow arrows -->
  <line x1="190" y1="125" x2="228" y2="125" class="flow"/>
  <text x="209" y="120" class="data-label">DataFrames</text>

  <line x1="390" y1="125" x2="428" y2="125" class="flow"/>
  <text x="409" y="120" class="data-label">callables</text>

  <!-- datasets → parquet output -->
  <path d="M 110 175 L 110 215 L 95 228" class="flow"/>

  <!-- runner → CLI -->
  <path d="M 510 175 L 510 195 L 430 213" class="flow"/>
  <text x="480" y="195" class="data-label">TimingResult[]</text>

  <!-- datasets → CLI -->
  <path d="M 190 165 L 250 200 L 328 230" class="flow"/>

  <!-- operations → CLI -->
  <path d="M 310 175 L 350 213" class="flow"/>

  <!-- CLI → visualize -->
  <line x1="490" y1="257" x2="528" y2="257" class="flow"/>
  <text x="509" y="252" class="data-label">results</text>

  <!-- CLI → figures -->
  <path d="M 490 290 L 510 310 L 528 330" class="flow"/>

  <!-- CLI → JSON output -->
  <path d="M 330 260 L 165 290" class="flow"/>
  <text x="247" y="268" class="data-label">JSON</text>

  <!-- Figures → PNG output -->
  <path d="M 530 355 L 165 345" class="flow"/>
</svg>
