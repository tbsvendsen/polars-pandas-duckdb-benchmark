[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-pandas-duckdb-benchmark"
version = "0.1.0"
description = "Systematic performance comparison of Polars, pandas and DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0,<2",
  "pandas>=2.0,<3",
  "duckdb>=1.0,<2",
  "pyarrow>=14.0",
  "plotly>=5.18",
  "numpy>=1.26",
  "faker>=28.0,<40",
  "psutil>=5.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faker.*", "plotly.*", "psutil.*", "pandas.*", "pyarrow.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]
